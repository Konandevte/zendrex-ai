<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zendrex AI</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #070a11;
  --panel: #0d111a;
  --panel2: #111722;
  --border: #202938;
  --text: #f4f7fb;
  --muted: #8b96a8;
  --blue: #3b82f6;
  --blue2: #2563eb;
  --danger: #ef4444;
  --user: #2563eb;
  --assistant: #111824;
}

body.light {
  --bg: #eef2f7;
  --panel: #ffffff;
  --panel2: #f4f6f9;
  --border: #dce2ea;
  --text: #111827;
  --muted: #64748b;
  --assistant: #f5f7fa;
}

body {
  background:
    radial-gradient(
      circle at top left,
      rgba(37, 99, 235, 0.14),
      transparent 35%
    ),
    var(--bg);

  color: var(--text);
  height: 100vh;
  overflow: hidden;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

/* APP */

.app {
  width: 100%;
  height: 100vh;
  display: flex;
}

/* SIDEBAR */

.sidebar {
  width: 270px;
  background: rgba(10, 14, 22, 0.9);
  border-right: 1px solid var(--border);
  padding: 15px;

  display: flex;
  flex-direction: column;

  transition: 0.25s;
}

body.light .sidebar {
  background: rgba(255,255,255,0.9);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 8px;
  margin-bottom: 15px;
}

.logo {
  width: 40px;
  height: 40px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #7c3aed
    );

  color: white;
  font-weight: 800;
  font-size: 18px;

  box-shadow:
    0 8px 25px rgba(37,99,235,.25);
}

.brand-text strong {
  display: block;
  font-size: 15px;
}

.brand-text span {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 2px;
}

.new-chat {
  width: 100%;
  border: 1px solid #31548c;

  background:
    linear-gradient(
      135deg,
      rgba(37,99,235,.2),
      rgba(124,58,237,.15)
    );

  color: var(--text);

  border-radius: 11px;
  padding: 11px;

  cursor: pointer;
  font-weight: 600;

  margin-bottom: 16px;

  transition: .2s;
}

.new-chat:hover {
  transform: translateY(-1px);
  border-color: var(--blue);
}

/* SIDEBAR SECTIONS */

.side-title {
  color: var(--muted);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .08em;

  padding: 0 8px;
  margin: 12px 0 8px;
}

.quick {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.quick button {
  text-align: left;

  border: none;
  background: transparent;

  color: var(--muted);

  padding: 9px;
  border-radius: 9px;

  cursor: pointer;

  transition: .15s;
}

.quick button:hover {
  background: var(--panel2);
  color: var(--text);
}

/* SIDEBAR BOTTOM */

.sidebar-bottom {
  margin-top: auto;

  display: flex;
  flex-direction: column;
  gap: 6px;
}

.side-button {
  border: 1px solid transparent;
  background: transparent;

  color: var(--muted);

  padding: 9px;
  border-radius: 9px;

  text-align: left;
  cursor: pointer;
}

.side-button:hover {
  background: var(--panel2);
  color: var(--text);
}

/* MAIN */

.main {
  flex: 1;

  display: flex;
  flex-direction: column;

  min-width: 0;
}

/* HEADER */

.topbar {
  height: 64px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 22px;

  border-bottom: 1px solid var(--border);

  background: rgba(7,10,17,.72);

  backdrop-filter: blur(15px);
}

body.light .topbar {
  background: rgba(255,255,255,.72);
}

.top-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.mobile-menu {
  display: none;

  border: none;
  background: transparent;

  color: var(--text);

  font-size: 21px;
  cursor: pointer;
}

.status-dot {
  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: #22c55e;

  box-shadow:
    0 0 10px rgba(34,197,94,.7);
}

.status {
  font-size: 13px;
  color: var(--muted);
}

.top-actions {
  display: flex;
  gap: 7px;
}

.icon-button {
  width: 36px;
  height: 36px;

  border-radius: 9px;

  border: 1px solid var(--border);

  background: var(--panel);

  color: var(--muted);

  cursor: pointer;

  transition: .15s;
}

.icon-button:hover {
  color: var(--text);
  border-color: #3b4a61;
}

/* CHAT */

.chat {
  flex: 1;

  overflow-y: auto;

  padding: 30px 20px 160px;

  scroll-behavior: smooth;
}

.chat-inner {
  width: 100%;
  max-width: 850px;
  margin: auto;
}

/* WELCOME */

.welcome {
  min-height: 60vh;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;
}

.welcome-box {
  max-width: 620px;
}

.welcome-logo {
  width: 68px;
  height: 68px;

  margin: 0 auto 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 21px;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #7c3aed
    );

  font-size: 28px;
  font-weight: 800;

  box-shadow:
    0 15px 45px rgba(37,99,235,.25);
}

.welcome h1 {
  font-size: 36px;
  letter-spacing: -.03em;

  margin-bottom: 10px;
}

.welcome p {
  color: var(--muted);
  line-height: 1.6;
}

/* PROMPTS */

.prompt-grid {
  margin-top: 27px;

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 9px;
}

.prompt {
  border: 1px solid var(--border);

  background: var(--panel);

  color: var(--text);

  padding: 14px;

  border-radius: 12px;

  text-align: left;

  cursor: pointer;

  transition: .18s;
}

.prompt:hover {
  border-color: #36517a;
  transform: translateY(-1px);
}

.prompt strong {
  display: block;
  font-size: 13px;
  margin-bottom: 4px;
}

.prompt span {
  color: var(--muted);
  font-size: 11px;
}

/* MESSAGES */

.message {
  display: flex;

  gap: 12px;

  margin-bottom: 26px;

  animation: messageIn .2s ease;
}

@keyframes messageIn {
  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.avatar {
  width: 32px;
  height: 32px;

  flex-shrink: 0;

  border-radius: 10px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 12px;
  font-weight: 700;
}

.user-avatar {
  background: #334155;
}

.ai-avatar {
  background:
    linear-gradient(
      135deg,
      #2563eb,
      #7c3aed
    );
}

.message-content {
  min-width: 0;
  flex: 1;
}

.message-name {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}

.message-text {
  font-size: 14px;
  line-height: 1.7;

  color: var(--text);

  overflow-wrap: anywhere;
}

.user-message .message-text {
  background: var(--user);

  display: inline-block;

  padding: 10px 14px;

  border-radius: 13px;

  color: white;

  line-height: 1.5;
}

/* MESSAGE ACTIONS */

.message-actions {
  display: flex;

  gap: 5px;

  margin-top: 8px;
}

.message-action {
  border: 1px solid var(--border);

  background: var(--panel);

  color: var(--muted);

  border-radius: 7px;

  padding: 5px 8px;

  font-size: 10px;

  cursor: pointer;
}

.message-action:hover {
  color: var(--text);
}

/* CODE */

.code-box {
  margin: 13px 0;

  border: 1px solid #29364a;

  border-radius: 11px;

  overflow: hidden;

  background: #080c12;
}

.code-head {
  height: 37px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 11px;

  background: #101722;

  border-bottom: 1px solid #29364a;
}

.code-lang {
  color: #8793a6;

  font-size: 10px;

  text-transform: uppercase;
}

.copy-code {
  border: none;

  background: transparent;

  color: #9ca8ba;

  cursor: pointer;

  font-size: 10px;
}

.copy-code:hover {
  color: white;
}

pre {
  padding: 16px;

  overflow-x: auto;

  margin: 0;
}

pre code {
  font-family:
    Consolas,
    Monaco,
    monospace;

  font-size: 12px;

  line-height: 1.65;

  color: #e5e7eb;
}

/* THINKING */

.thinking {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 8px 0;
}

.thinking span {
  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: #7d899b;

  animation: typing 1.2s infinite;
}

.thinking span:nth-child(2) {
  animation-delay: .15s;
}

.thinking span:nth-child(3) {
  animation-delay: .3s;
}

@keyframes typing {

  0%, 60%, 100% {
    opacity: .25;
    transform: translateY(0);
  }

  30% {
    opacity: 1;
    transform: translateY(-3px);
  }

}

/* INPUT AREA */

.input-wrapper {
  position: fixed;

  bottom: 0;

  left: 270px;
  right: 0;

  padding: 16px 20px 20px;

  background:
    linear-gradient(
      transparent,
      var(--bg) 35%
    );

  pointer-events: none;
}

.input-box {
  pointer-events: auto;

  max-width: 850px;

  margin: auto;

  border: 1px solid #344054;

  background: var(--panel);

  border-radius: 16px;

  box-shadow:
    0 12px 45px rgba(0,0,0,.25);

  overflow: hidden;
}

.input-row {
  display: flex;
  align-items: flex-end;

  padding: 9px;
  gap: 8px;
}

#message {
  flex: 1;

  resize: none;

  border: none;
  outline: none;

  background: transparent;

  color: var(--text);

  min-height: 42px;
  max-height: 150px;

  padding: 10px;

  font-size: 14px;

  line-height: 1.5;
}

#message::placeholder {
  color: #718096;
}

.send-button {
  width: 42px;
  height: 42px;

  border: none;

  border-radius: 11px;

  background: var(--blue);

  color: white;

  cursor: pointer;

  font-size: 16px;

  transition: .15s;
}

.send-button:hover {
  background: var(--blue2);
  transform: translateY(-1px);
}

.send-button:disabled {
  opacity: .5;
  cursor: not-allowed;
  transform: none;
}

.stop-button {
  display: none;

  width: 42px;
  height: 42px;

  border: none;

  border-radius: 11px;

  background: #334155;

  color: white;

  cursor: pointer;
}

.input-footer {
  display: flex;

  justify-content: space-between;

  align-items: center;

  padding: 0 12px 8px;

  color: var(--muted);

  font-size: 10px;
}

.char-count {
  opacity: .7;
}

/* MOBILE */

@media (max-width: 750px) {

  .sidebar {
    position: fixed;

    left: -280px;
    top: 0;
    bottom: 0;

    z-index: 50;

    transition: .25s;
  }

  .sidebar.open {
    left: 0;
  }

  .mobile-menu {
    display: block;
  }

  .input-wrapper {
    left: 0;
  }

  .topbar {
    padding: 0 13px;
  }

  .chat {
    padding: 20px 13px 150px;
  }

  .welcome h1 {
    font-size: 29px;
  }

  .prompt-grid {
    grid-template-columns: 1fr;
  }

}

/* SEARCH */

.search-box {
  display: none;

  position: absolute;

  top: 60px;
  right: 15px;

  width: 280px;

  padding: 10px;

  border: 1px solid var(--border);

  border-radius: 12px;

  background: var(--panel);

  z-index: 30;
}

.search-box.show {
  display: block;
}

.search-box input {
  width: 100%;

  border: 1px solid var(--border);

  background: var(--panel2);

  color: var(--text);

  border-radius: 8px;

  padding: 9px;

  outline: none;
}

</style>
</head>


<body>

              >

      </div>

    </div>

  </main>

</div>


<script>

const WORKER_URL =
  "https://steep-fog-986f.konanwork99.workers.dev";


const input =
  document.getElementById("message");

const send =
  document.getElementById("send");

const stopButton =
  document.getElementById("stopButton");

const chat =
  document.getElementById("chat");

const chatInner =
  document.getElementById("chatInner");

const welcome =
  document.getElementById("welcome");

const charCount =
  document.getElementById("charCount");

const sidebar =
  document.getElementById("sidebar");


let currentController = null;

let conversation = [];


/* =========================
   LOCAL STORAGE
========================= */

function saveChat() {

  localStorage.setItem(
    "zendrex_chat",
    JSON.stringify(conversation)
  );

}


function loadChat() {

  try {

    const saved =
      JSON.parse(
        localStorage.getItem(
          "zendrex_chat"
        )
      );

    if (
      Array.isArray(saved) &&
      saved.length
    ) {

      conversation = saved;

      welcome.style.display =
        "none";

      conversation.forEach(item => {

        addMessageToUI(
          item.role,
          item.content,
          false
        );

      });

    }

  } catch {

    conversation = [];

  }

}


/* =========================
   COPY
========================= */

async function copyText(
  text,
  button,
  normalText
) {

  try {

    await navigator.clipboard.writeText(text);

    button.textContent =
      "Copied!";

    setTimeout(() => {

      button.textContent =
        normalText;

    }, 1200);

  } catch {

    button.textContent =
      "Failed";

  }

}


/* =========================
   CODE RENDERING
========================= */

function renderContent(
  container,
  text
) {

  const parts =
    text.split("```");


  parts.forEach(
    (part, index) => {

      if (index % 2 === 0) {

        if (part.trim()) {

          const normal =
            document.createElement(
              "div"
            );

          normal.textContent =
            part.trim();

          container.appendChild(
            normal
          );

        }

        return;

      }


      let code =
        part.trim();

      let language =
        "code";


      const lines =
        code.split("\n");


      if (
        lines.length > 1 &&
        /^[a-zA-Z0-9+#._-]+$/.test(
          lines[0].trim()
        )
      ) {

        language =
          lines.shift().trim();

        code =
          lines.join("\n").trim();

      }


      const box =
        document.createElement(
          "div"
        );

      box.className =
        "code-box";


      const head =
        document.createElement(
          "div"
        );

      head.className =
        "code-head";


      const lang =
        document.createElement(
          "span"
        );

      lang.className =
        "code-lang";

      lang.textContent =
        language;


      const copy =
        document.createElement(
          "button"
        );

      copy.className =
        "copy-code";

      copy.textContent =
        "Copy code";


      copy.onclick = () => {

        copyText(
          code,
          copy,
          "Copy code"
        );

      };


      head.appendChild(lang);
      head.appendChild(copy);


      const pre =
        document.createElement(
          "pre"
        );


      const codeElement =
        document.createElement(
          "code"
        );


      codeElement.textContent =
        code;


      pre.appendChild(
        codeElement
      );


      box.appendChild(head);
      box.appendChild(pre);


      container.appendChild(box);

    }
  );

}


/* =========================
   ADD MESSAGE
========================= */

function addMessageToUI(
  role,
  text,
  save = true
) {

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message " +
    (
      role === "user"
        ? "user-message"
        : "ai-message"
    );


  const avatar =
    document.createElement(
      "div"
    );

  avatar.className =
    "avatar " +
    (
      role === "user"
        ? "user-avatar"
        : "ai-avatar"
    );

  avatar.textContent =
    role === "user"
      ? "U"
      : "Z";


  const content =
    document.createElement(
      "div"
    );

  content.className =
    "message-content";


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "message-name";

  name.textContent =
    role === "user"
      ? "You"
      : "Zendrex AI";


  const textElement =
    document.createElement(
      "div"
    );

  textElement.className =
    "message-text";


  if (role === "user") {

    textElement.textContent =
      text;

  } else {

    renderContent(
      textElement,
      text
    );

  }


  content.appendChild(name);
  content.appendChild(textElement);


  /* AI ACTIONS */

  if (role === "assistant") {

    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "message-actions";


    const copy =
      document.createElement(
        "button"
      );

    copy.className =
      "message-action";

    copy.textContent =
      "Copy";


    copy.onclick = () => {

      copyText(
        text,
        copy,
        "Copy"
      );

    };


    const regenerate =
      document.createElement(
        "button"
      );

    regenerate.className =
      "message-action";

    regenerate.textContent =
      "Regenerate";


    regenerate.onclick = () => {

      regenerateLast();

    };


    actions.appendChild(copy);
    actions.appendChild(regenerate);

    content.appendChild(actions);

  }


  message.appendChild(avatar);
  message.appendChild(content);


  chatInner.appendChild(message);


  if (save) {

    conversation.push({
      role,
      content: text
    });

    saveChat();

  }


  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   THINKING
========================= */

function createThinking() {

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message ai-message";


  const avatar =
    document.createElement(
      "div"
    );

  avatar.className =
    "avatar ai-avatar";

  avatar.textContent =
    "Z";


  const content =
    document.createElement(
      "div"
    );

  content.className =
    "message-content";


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "message-name";

  name.textContent =
    "Zendrex AI";


  const thinking =
    document.createElement(
      "div"
    );

  thinking.className =
    "thinking";

  thinking.innerHTML =
    "<span></span><span></span><span></span>";


  content.appendChild(name);
  content.appendChild(thinking);


  message.appendChild(avatar);
  message.appendChild(content);


  chatInner.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;


  return message;

}


/* =========================
   SEND
========================= */

async function sendMessage(
  customText = null
) {

  const text =
    customText !== null
      ? customText
      : input.value.trim();


  if (!text || currentController) {
    return;
  }


  welcome.style.display =
    "none";


  input.value = "";

  updateCounter();


  addMessageToUI(
    "user",
    text
  );


  const thinking =
    createThinking();


  send.style.display =
    "none";

  stopButton.style.display =
    "block";


  currentController =
    new AbortController();


  try {

    const response =
      await fetch(
        WORKER_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            prompt: text
          }),

          signal:
            currentController.signal

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Request failed"
      );

    }


    thinking.remove();


    const answer =
      data.answer ||
      "I couldn't generate an answer.";


    addMessageToUI(
      "assistant",
      answer
    );


  } catch (error) {

    thinking.remove();


    if (
      error.name !==
      "AbortError"
    ) {

      addMessageToUI(
        "assistant",
        "Sorry, Zendrex AI could not connect to the AI server."
      );

    }

  } finally {

    currentController =
      null;

    send.style.display =
      "block";

    stopButton.style.display =
      "none";

    input.focus();

  }

}


/* =========================
   STOP
========================= */

stopButton.onclick = () => {

  if (currentController) {

    currentController.abort();

    currentController = null;

  }

  send.style.display =
    "block";

  stopButton.style.display =
    "none";

};


/* =========================
   COUNTER
========================= */

function updateCounter() {

  charCount.textContent =
    input.value.length;

}


input.addEventListener(
  "input",
  updateCounter
);


/* =========================
   ENTER
========================= */

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   BUTTON
========================= */

send.onclick =
  () => sendMessage();


/* =========================
   QUICK PROMPTS
========================= */

document
  .querySelectorAll(
    "[data-prompt]"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const prompt =
          button.dataset.prompt;

        input.value =
          prompt;

        updateCounter();

        input.focus();

      }
    );

  });


/* =========================
   NEW CHAT
========================= */

document
  .getElementById("newChat")
  .onclick = () => {

    conversation = [];

    localStorage.removeItem(
      "zendrex_chat"
    );

    location.reload();

  };


/* =========================
   CLEAR CHAT
========================= */

document
  .getElementById("clearChat")
  .onclick = () => {

    if (
      !conversation.length
    ) {
      return;
    }


    conversation = [];

    localStorage.removeItem(
      "zendrex_chat"
    );


    document
      .querySelectorAll(
        ".message"
      )
      .forEach(
        element =>
          element.remove()
      );


    welcome.style.display =
      "flex";

  };


/* =========================
   THEME
========================= */

document
  .getElementById("themeButton")
  .onclick = () => {

    document.body.classList.toggle(
      "light"
    );


    localStorage.setItem(
      "zendrex_theme",
      document.body.classList.contains(
        "light"
      )
        ? "light"
        : "dark"
    );

  };


if (
  localStorage.getItem(
    "zendrex_theme"
  ) === "light"
) {

  document.body.classList.add(
    "light"
  );

}


/* =========================
   MOBILE MENU
========================= */

document
  .getElementById("mobileMenu")
  .onclick = () => {

    sidebar.classList.toggle(
      "open"
    );

  };


/* =========================
   SEARCH
========================= */

const searchButton =
  document.getElementById(
    "searchButton"
  );

const searchBox =
  document.getElementById(
    "searchBox"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );


searchButton.onclick = () => {

  searchBox.classList.toggle(
    "show"
  );

  if (
    searchBox.classList.contains(
      "show"
    )
  ) {

    searchInput.focus();

  }

};


searchInput.addEventListener(
  "input",
  () => {

    const query =
      searchInput.value
        .toLowerCase()
        .trim();


    document
      .querySelectorAll(
        ".message"
      )
      .forEach(message => {

        if (!query) {

          message.style.display =
            "";

          return;

        }


        const text =
          message.textContent
            .toLowerCase();


        message.style.display =
          text.includes(query)
            ? ""
            : "none";

      });

  }
);


/* =========================
   EXPORT
========================= */

document
  .getElementById("exportChat")
  .onclick = () => {

    if (
      !conversation.length
    ) {
      return;
    }


    let output =
      "ZENDREX AI CHAT\n";

    output +=
      "====================\n\n";


    conversation.forEach(
      item => {

        output +=
          (
            item.role === "user"
              ? "YOU"
              : "ZENDREX AI"
          ) +
          ":\n";

        output +=
          item.content +
          "\n\n";

      }
    );


    const blob =
      new Blob(
        [output],
        {
          type:
            "text/plain"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );

    link.href =
      url;

    link.download =
      "zendrex-chat.txt";

    link.click();


    URL.revokeObjectURL(
      url
    );

  };


/* =========================
   REGENERATE
========================= */

function regenerateLast() {

  if (
    currentController
  ) {
    return;
  }


  if (
    conversation.length < 2
  ) {
    return;
  }


  const lastUser =
    [...conversation]
      .reverse()
      .find(
        item =>
          item.role === "user"
      );


  if (!lastUser) {
    return;
  }


  sendMessage(
    lastUser.content
  );

}


/* =========================
   LOAD
========================= */

loadChat();

input.focus();

</script>

</body>
</html>
