<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zendrex AI</title>

<style>

/* =========================
   RESET
========================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #0b0e14;
  --panel: #10141c;
  --panel-light: #171c25;
  --border: #272e3a;

  --text: #f5f7fb;
  --muted: #9aa4b4;

  --blue: #3b82f6;
  --blue-hover: #2563eb;

  --user: #2563eb;
  --assistant: #151b25;
}


/* =========================
   BODY
========================= */

body {
  height: 100vh;
  overflow: hidden;

  background:
    radial-gradient(
      circle at 20% 0%,
      rgba(59,130,246,0.12),
      transparent 35%
    ),
    var(--bg);

  color: var(--text);

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}


/* =========================
   APP
========================= */

.app {
  width: 100%;
  height: 100vh;

  display: flex;
}


/* =========================
   SIDEBAR
========================= */

.sidebar {
  width: 270px;
  flex-shrink: 0;

  background: rgba(13,17,24,0.96);

  border-right: 1px solid var(--border);

  padding: 18px;

  display: flex;
  flex-direction: column;
}


.brand {
  display: flex;
  align-items: center;

  gap: 12px;

  margin-bottom: 20px;
}


.logo {
  width: 43px;
  height: 43px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #7c3aed
    );

  color: white;

  font-size: 19px;
  font-weight: 800;
}


.brand-title {
  font-size: 16px;
  font-weight: 700;
}


.brand-subtitle {
  color: var(--muted);

  font-size: 12px;

  margin-top: 3px;
}


/* NEW CHAT */

.new-chat {
  width: 100%;

  padding: 12px;

  border-radius: 10px;

  border: 1px solid #34445d;

  background: #151d2a;

  color: var(--text);

  font-size: 14px;
  font-weight: 600;

  cursor: pointer;

  transition: 0.15s;
}


.new-chat:hover {
  background: #1c2737;
  border-color: #4b6d9d;
}


/* SIDEBAR TITLE */

.sidebar-title {
  margin-top: 25px;
  margin-bottom: 9px;

  padding-left: 5px;

  color: #788397;

  font-size: 11px;

  text-transform: uppercase;

  letter-spacing: 0.08em;
}


/* QUICK BUTTONS */

.quick-button {
  width: 100%;

  padding: 10px;

  margin-bottom: 3px;

  border: none;

  border-radius: 8px;

  background: transparent;

  color: #aab3c2;

  text-align: left;

  font-size: 14px;

  cursor: pointer;
}


.quick-button:hover {
  background: #171e29;
  color: white;
}


/* SIDEBAR BOTTOM */

.sidebar-bottom {
  margin-top: auto;
}


.sidebar-button {
  width: 100%;

  padding: 10px;

  border: none;

  border-radius: 8px;

  background: transparent;

  color: #aab3c2;

  text-align: left;

  font-size: 13px;

  cursor: pointer;
}


.sidebar-button:hover {
  background: #171e29;
  color: white;
}


/* =========================
   MAIN
========================= */

.main {
  flex: 1;

  min-width: 0;

  display: flex;
  flex-direction: column;
}


/* =========================
   TOP BAR
========================= */

.topbar {
  height: 65px;

  flex-shrink: 0;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 22px;

  border-bottom: 1px solid var(--border);

  background: rgba(11,14,20,0.88);

  backdrop-filter: blur(12px);
}


.top-left {
  display: flex;

  align-items: center;

  gap: 9px;
}


.status-dot {
  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: #22c55e;

  box-shadow:
    0 0 9px rgba(34,197,94,0.7);
}


.status-text {
  color: #a7b0bf;

  font-size: 13px;
}


.top-actions {
  display: flex;

  gap: 7px;
}


.icon-button {
  width: 38px;
  height: 38px;

  border-radius: 9px;

  border: 1px solid var(--border);

  background: var(--panel);

  color: #aab3c2;

  font-size: 16px;

  cursor: pointer;
}


.icon-button:hover {
  color: white;

  background: #171e29;
}


/* =========================
   CHAT AREA
========================= */

.chat {
  flex: 1;

  overflow-y: auto;

  padding: 35px 25px 170px;
}


.chat-inner {
  width: 100%;

  max-width: 900px;

  margin: auto;
}


/* =========================
   WELCOME
========================= */

.welcome {
  min-height: 62vh;

  display: flex;

  justify-content: center;

  align-items: center;

  text-align: center;
}


.welcome-content {
  width: 100%;

  max-width: 650px;
}


.welcome-logo {
  width: 72px;
  height: 72px;

  margin: 0 auto 22px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 21px;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #7c3aed
    );

  font-size: 29px;

  font-weight: 800;

  box-shadow:
    0 15px 45px rgba(37,99,235,0.25);
}


.welcome h1 {
  font-size: 36px;

  line-height: 1.2;

  margin-bottom: 12px;

  letter-spacing: -0.8px;
}


.welcome p {
  color: var(--muted);

  font-size: 16px;

  line-height: 1.6;
}


/* =========================
   PROMPTS
========================= */

.prompt-grid {
  margin-top: 30px;

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 10px;
}


.prompt {
  padding: 16px;

  border-radius: 12px;

  border: 1px solid var(--border);

  background: var(--panel);

  color: var(--text);

  text-align: left;

  cursor: pointer;

  transition: 0.15s;
}


.prompt:hover {
  background: #151c27;

  border-color: #3a4b65;

  transform: translateY(-1px);
}


.prompt strong {
  display: block;

  font-size: 14px;

  margin-bottom: 5px;
}


.prompt span {
  color: var(--muted);

  font-size: 12px;
}


/* =========================
   MESSAGES
========================= */

.message {
  display: flex;

  gap: 13px;

  margin-bottom: 30px;

  animation:
    messageAppear 0.18s ease;
}


@keyframes messageAppear {

  from {
    opacity: 0;

    transform:
      translateY(5px);
  }

  to {
    opacity: 1;

    transform:
      translateY(0);
  }

}


.avatar {
  width: 35px;
  height: 35px;

  flex-shrink: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 10px;

  font-size: 13px;

  font-weight: 700;
}


.user-avatar {
  background: #334155;

  color: white;
}


.ai-avatar {
  background:
    linear-gradient(
      135deg,
      #2563eb,
      #7c3aed
    );

  color: white;
}


.message-content {
  flex: 1;

  min-width: 0;
}


.message-name {
  color: #8994a6;

  font-size: 12px;

  margin-bottom: 7px;
}


.message-text {
  color: var(--text);

  font-size: 16px;

  line-height: 1.7;

  overflow-wrap: anywhere;
}


.user-message .message-text {
  display: inline-block;

  padding: 11px 16px;

  border-radius: 13px;

  background: var(--user);

  color: white;

  font-size: 16px;

  line-height: 1.55;
}


/* =========================
   MESSAGE BUTTONS
========================= */

.message-actions {
  display: flex;

  gap: 7px;

  margin-top: 9px;
}


.message-action {
  padding: 6px 10px;

  border-radius: 7px;

  border: 1px solid var(--border);

  background: var(--panel);

  color: #8994a6;

  font-size: 11px;

  cursor: pointer;
}


.message-action:hover {
  color: white;

  background: #171e29;
}


/* =========================
   CODE BLOCK
========================= */

.code-box {
  margin: 14px 0;

  overflow: hidden;

  border-radius: 11px;

  border: 1px solid #303b4e;

  background: #080b10;
}


.code-header {
  height: 39px;

  padding: 0 12px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  background: #111722;

  border-bottom: 1px solid #303b4e;
}


.code-language {
  color: #8d99aa;

  font-size: 11px;

  text-transform: uppercase;
}


.copy-code {
  border: none;

  background: transparent;

  color: #aab4c4;

  font-size: 11px;

  cursor: pointer;
}


.copy-code:hover {
  color: white;
}


pre {
  margin: 0;

  padding: 17px;

  overflow-x: auto;
}


pre code {
  color: #e8edf5;

  font-family:
    Consolas,
    Monaco,
    monospace;

  font-size: 14px;

  line-height: 1.65;
}


/* =========================
   THINKING
========================= */

.thinking {
  display: flex;

  align-items: center;

  gap: 5px;

  padding: 8px 0;
}


.thinking span {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #8b96a8;

  animation:
    typing 1.2s infinite;
}


.thinking span:nth-child(2) {
  animation-delay: .15s;
}


.thinking span:nth-child(3) {
  animation-delay: .3s;
}


@keyframes typing {

  0%,
  60%,
  100% {
    opacity: .25;

    transform:
      translateY(0);
  }

  30% {
    opacity: 1;

    transform:
      translateY(-3px);
  }

}


/* =========================
   INPUT
========================= */

.input-area {
  position: fixed;

  left: 270px;

  right: 0;

  bottom: 0;

  padding:
    15px
    25px
    21px;

  background:
    linear-gradient(
      transparent,
      var(--bg) 32%
    );

  pointer-events: none;
}


.input-box {
  max-width: 900px;

  margin: auto;

  pointer-events: auto;

  border:
    1px solid #354154;

  border-radius: 16px;

  background: #111722;

  box-shadow:
    0 15px 45px
    rgba(0,0,0,0.28);
}


.input-row {
  display: flex;

  align-items: flex-end;

  gap: 8px;

  padding: 9px;
}


#message {
  flex: 1;

  min-height: 45px;

  max-height: 160px;

  resize: none;

  border: none;

  outline: none;

  background: transparent;

  color: white;

  padding:
    10px
    11px;

  font-family: inherit;

  font-size: 16px;

  line-height: 1.55;
}


#message::placeholder {
  color: #758094;
}


.send-button {
  width: 44px;
  height: 44px;

  flex-shrink: 0;

  border: none;

  border-radius: 11px;

  background: var(--blue);

  color: white;

  font-size: 18px;

  cursor: pointer;

  transition: .15s;
}


.send-button:hover {
  background: var(--blue-hover);

  transform:
    translateY(-1px);
}


.send-button:disabled {
  opacity: .5;

  cursor: not-allowed;

  transform: none;
}


.stop-button {
  display: none;

  width: 44px;
  height: 44px;

  border: none;

  border-radius: 11px;

  background: #374151;

  color: white;

  cursor: pointer;
}


.input-footer {
  display: flex;

  align-items: center;

  justify-content: space-between;

  padding:
    0
    13px
    9px;

  color: #758094;

  font-size: 11px;
}


.char-count {
  opacity: .75;
}


/* =========================
   MOBILE
========================= */

.mobile-menu {
  display: none;
}


@media (max-width: 750px) {

  .sidebar {
    position: fixed;

    left: -280px;

    top: 0;

    bottom: 0;

    z-index: 100;

    transition: .25s;
  }


  .sidebar.open {
    left: 0;
  }


  .mobile-menu {
    display: block;

    border: none;

    background: transparent;

    color: white;

    font-size: 20px;

    cursor: pointer;
  }


  .input-area {
    left: 0;

    padding:
      10px
      12px
      14px;
  }


  .chat {
    padding:
      25px
      14px
      155px;
  }


  .welcome h1 {
    font-size: 29px;
  }


  .welcome p {
    font-size: 15px;
  }


  .prompt-grid {
    grid-template-columns: 1fr;
  }


  .message-text,
  .user-message .message-text {
    font-size: 16px;
  }

}

</style>
</head>


<body>

<div class="app">


  <!-- =====================
       SIDEBAR
  ====================== -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="brand">

      <div class="logo">
        Z
      </div>

      <div>

        <div class="brand-title">
          Zendrex AI
        </div>

        <div class="brand-subtitle">
          Smart. Simple. Fast.
        </div>

      </div>

    </div>


    <button
      class="new-chat"
      id="newChat"
    >
      + New chat
    </button>


    <div class="sidebar-title">
      Quick prompts
    </div>


    <button
      class="quick-button"
      data-prompt="Explain something to me simply"
    >
      Explain something
    </button>


    <button
      class="quick-button"
      data-prompt="Help me write something"
    >
      Help me write
    </button>


    <button
      class="quick-button"
      data-prompt="Help me with a coding problem"
    >

    <div class="sidebar-bottom">

        </button>

        <span class="status-text">

        </span>

      <div class="top-actions">

        <button
          class="icon-button"

    <!-- CHAT -->

    <section

      <div

      >


        <!-- WELCOME -->

        <div

          <div class="welcome-content">

            <h1>

            </h1>


            <p>
              Ask a question, write something,
              solve a problem, or build something.
            </p>


            <div class="prompt-grid">


              <button
                class="prompt"
                data-prompt="Explain artificial intelligence in simple words"
              >

                <strong>

                </strong>

                <span>

                </span>

              </button>


              <button
                class="prompt"
                data-prompt="Give me some creative ideas for a website"
              >

                <strong>
                  Brainstorm
                </strong>

                <span>
                  Generate useful ideas
                </span>

              </button>


              <button
                class="prompt"
                data-prompt="Help me write a professional message"
              >

                  Write something
                </strong>

                <span>
                  Messages, posts and more
                </span>

              </button>


              <button
                class="prompt"
                data-prompt="Help me debug my code"
              >

                <strong>

    <!-- INPUT -->

    <div class="input-area">

      <div class="input-box">

        <div class="input-row">

          <textarea

          <button
            class="stop-button"

  </main>

</div>


<script>

/* =========================
   CONFIG
========================= */

const WORKER_URL =
  "https://steep-fog-986f.konanwork99.workers.dev";


/* =========================
   ELEMENTS
========================= */

const input =
  document.getElementById(
    "message"
  );

const send =
  document.getElementById(
    "send"
  );

const stopButton =
  document.getElementById(
    "stopButton"
  );

const chat =
  document.getElementById(
    "chat"
  );

const chatInner =
  document.getElementById(
    "chatInner"
  );

const welcome =
  document.getElementById(
    "welcome"
  );

const charCount =
  document.getElementById(
    "charCount"
  );

const sidebar =
  document.getElementById(
    "sidebar"
  );


let controller = null;

let conversation = [];


/* =========================
   STORAGE
========================= */

function saveConversation() {

  localStorage.setItem(
    "zendrex_conversation",
    JSON.stringify(
      conversation
    )
  );

}


function loadConversation() {

  try {

    const saved =
      JSON.parse(
        localStorage.getItem(
          "zendrex_conversation"
        )
      );


    if (
      Array.isArray(saved) &&
      saved.length > 0
    ) {

      conversation =
        saved;

      welcome.style.display =
        "none";


      saved.forEach(item => {

        createMessage(
          item.role,
          item.content,
          false
        );

      });

    }

  } catch {

    conversation = [];

  }

}


/* =========================
   COPY
========================= */

async function copyText(
  text,
  button,
  original
) {

  try {

    await navigator.clipboard.writeText(
      text
    );


    button.textContent =
      "Copied!";


    setTimeout(() => {

      button.textContent =
        original;

    }, 1200);


  } catch {

    button.textContent =
      "Failed";

  }

}


/* =========================
   RENDER ANSWER
========================= */

function renderAnswer(
  element,
  text
) {

  const parts =
    text.split("```");


  parts.forEach(
    (part, index) => {

      /* NORMAL TEXT */

      if (
        index % 2 === 0
      ) {

        if (
          part.trim()
        ) {

          const normal =
            document.createElement(
              "div"
            );


          normal.textContent =
            part.trim();


          element.appendChild(
            normal
          );

        }

        return;
      }


      /* CODE */

      let code =
        part.trim();


      let language =
        "code";


      const lines =
        code.split("\n");


      if (
        lines.length > 1 &&
        /^[a-zA-Z0-9+#._-]+$/.test(
          lines[0].trim()
        )
      ) {

        language =
          lines.shift().trim();

        code =
          lines.join("\n").trim();

      }


      const box =
        document.createElement(
          "div"
        );

      box.className =
        "code-box";


      const header =
        document.createElement(
          "div"
        );

      header.className =
        "code-header";


      const languageText =
        document.createElement(
          "span"
        );

      languageText.className =
        "code-language";

      languageText.textContent =
        language;


      const copy =
        document.createElement(
          "button"
        );

      copy.className =
        "copy-code";

      copy.textContent =
        "Copy code";


      copy.onclick =
        () => {

          copyText(
            code,
            copy,
            "Copy code"
          );

        };


      header.appendChild(
        languageText
      );

      header.appendChild(
        copy
      );


      const pre =
        document.createElement(
          "pre"
        );


      const codeElement =
        document.createElement(
          "code"
        );


      codeElement.textContent =
        code;


      pre.appendChild(
        codeElement
      );


      box.appendChild(
        header
      );

      box.appendChild(
        pre
      );


      element.appendChild(
        box
      );

    }
  );

}


/* =========================
   CREATE MESSAGE
========================= */

function createMessage(
  role,
  text,
  save = true
) {

  const message =
    document.createElement(
      "div"
    );


  message.className =
    "message " +
    (
      role === "user"
        ? "user-message"
        : "ai-message"
    );


  const avatar =
    document.createElement(
      "div"
    );


  avatar.className =
    "avatar " +
    (
      role === "user"
        ? "user-avatar"
        : "ai-avatar"
    );


  avatar.textContent =
    role === "user"
      ? "U"
      : "Z";


  const content =
    document.createElement(
      "div"
    );


  content.className =
    "message-content";


  const name =
    document.createElement(
      "div"
    );


  name.className =
    "message-name";


  name.textContent =
    role === "user"
      ? "You"
      : "Zendrex AI";


  const messageText =
    document.createElement(
      "div"
    );


  messageText.className =
    "message-text";


  if (
    role === "user"
  ) {

    messageText.textContent =
      text;

  } else {

    renderAnswer(
      messageText,
      text
    );

  }


  content.appendChild(
    name
  );

  content.appendChild(
    messageText
  );


  /* AI ACTIONS */

  if (
    role === "assistant"
  ) {

    const actions =
      document.createElement(
        "div"
      );


    actions.className =
      "message-actions";


    const copy =
      document.createElement(
        "button"
      );


    copy.className =
      "message-action";

    copy.textContent =
      "Copy";


    copy.onclick =
      () => {

        copyText(
          text,
          copy,
          "Copy"
        );

      };


    actions.appendChild(
      copy
    );


    content.appendChild(
      actions
    );

  }


  message.appendChild(
    avatar
  );

  message.appendChild(
    content
  );


  chatInner.appendChild(
    message
  );


  if (save) {

    conversation.push({
      role: role,
      content: text
    });


    saveConversation();

  }


  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   THINKING
========================= */

function createThinking() {

  const message =
    document.createElement(
      "div"
    );


  message.className =
    "message ai-message";


  const avatar =
    document.createElement(
      "div"
    );


  avatar.className =
    "avatar ai-avatar";


  avatar.textContent =
    "Z";


  const content =
    document.createElement(
      "div"
    );


  content.className =
    "message-content";


  const name =
    document.createElement(
      "div"
    );


  name.className =
    "message-name";


  name.textContent =
    "Zendrex AI";


  const thinking =
    document.createElement(
      "div"
    );


  thinking.className =
    "thinking";


  thinking.innerHTML =
    "<span></span><span></span><span></span>";


  content.appendChild(
    name
  );

  content.appendChild(
    thinking
  );


  message.appendChild(
    avatar
  );

  message.appendChild(
    content
  );


  chatInner.appendChild(
    message
  );


  chat.scrollTop =
    chat.scrollHeight;


  return message;

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(
  customText = null
) {

  const text =
    customText !== null
      ? customText
      : input.value.trim();


  if (
    !text ||
    controller
  ) {

    return;

  }


  welcome.style.display =
    "none";


  input.value = "";

  updateCounter();


  createMessage(
    "user",
    text
  );


  const thinking =
    createThinking();


  send.style.display =
    "none";


  stopButton.style.display =
    "block";


  controller =
    new AbortController();


  try {

    const response =
      await fetch(
        WORKER_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            prompt: text
          }),

          signal:
            controller.signal

        }
      );


    const data =
      await response.json();


    if (
      !response.ok
    ) {

      throw new Error(
        data.error ||
        "Request failed"
      );

    }


    thinking.remove();


    const answer =
      data.answer ||
      "I couldn't generate an answer.";


    createMessage(
      "assistant",
      answer
    );


  } catch (error) {

    thinking.remove();


    if (
      error.name !==
      "AbortError"
    ) {

      createMessage(
        "assistant",
        "Sorry, Zendrex AI could not connect to the AI server."
      );

    }

  } finally {

    controller =
      null;


    send.style.display =
      "block";


    stopButton.style.display =
      "none";


    input.focus();

  }

}


/* =========================
   STOP
========================= */

stopButton.onclick =
  () => {

    if (controller) {

      controller.abort();

      controller = null;

    }


    send.style.display =
      "block";


    stopButton.style.display =
      "none";

  };


/* =========================
   COUNTER
========================= */

function updateCounter() {

  charCount.textContent =
    input.value.length;

}


input.addEventListener(
  "input",
  updateCounter
);


/* =========================
   ENTER
========================= */

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   SEND BUTTON
========================= */

send.onclick =
  () => sendMessage();


/* =========================
   QUICK PROMPTS
========================= */

document
  .querySelectorAll(
    "[data-prompt]"
  )
  .forEach(button => {

    button.onclick =
      () => {

        input.value =
          button.dataset.prompt;

        updateCounter();

        input.focus();

      };

  });


/* =========================
   NEW CHAT
========================= */

document
  .getElementById(
    "newChat"
  )
  .onclick =
  () => {

    conversation = [];

    localStorage.removeItem(
      "zendrex_conversation"
    );


    document
      .querySelectorAll(
        ".message"
      )
      .forEach(
        element =>
          element.remove()
      );


    welcome.style.display =
      "flex";

  };


/* =========================
   CLEAR CHAT
========================= */

document
  .getElementById(
    "clearChat"
  )
  .onclick =
  () => {

    conversation = [];

    localStorage.removeItem(
      "zendrex_conversation"
    );


    document
      .querySelectorAll(
        ".message"
      )
      .forEach(
        element =>
          element.remove()
      );


    welcome.style.display =
      "flex";

  };


/* =========================
   THEME
========================= */

document
  .getElementById(
    "themeButton"
  )
  .onclick =
  () => {

    document.body.classList.toggle(
      "light"
    );

  };


/* =========================
   MOBILE MENU
========================= */

document
  .getElementById(
    "mobileMenu"
  )
  ?.addEventListener(
    "click",
    () => {

      sidebar.classList.toggle(
        "open"
      );

    }
  );


/* =========================
   EXPORT
========================= */

document
  .getElementById(
    "exportChat"
  )
  .onclick =
  () => {

    if (
      conversation.length === 0
    ) {

      return;

    }


    let output =
      "ZENDREX AI CHAT\n";

    output +=
      "====================\n\n";


    conversation.forEach(
      item => {

        output +=
          (
            item.role === "user"
              ? "YOU"
              : "ZENDREX AI"
          );

        output += ":\n";

        output +=
          item.content;

        output +=
          "\n\n";

      }
    );


    const blob =
      new Blob(
        [output],
        {
          type:
            "text/plain"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      url;

    link.download =
      "zendrex-chat.txt";


    link.click();


    URL.revokeObjectURL(
      url
    );

  };


/* =========================
   LOAD
========================= */

loadConversation();

input.focus();

</script>

</body>
</html>
