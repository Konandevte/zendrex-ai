<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zendrex AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f19;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 95%;
      max-width: 900px;
      height: 90vh;
      background: #111827;
      border: 1px solid #263244;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 20px;
      border-bottom: 1px solid #263244;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .header h1 {
      font-size: 22px;
    }

    .header p {
      color: #9ca3af;
      font-size: 13px;
      margin-top: 3px;
    }

    .chat {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
    }

    .welcome {
      text-align: center;
      margin-top: 100px;
    }

    .welcome h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #9ca3af;
    }

    .input-area {
      padding: 18px;
      border-top: 1px solid #263244;
      display: flex;
      gap: 10px;
    }

    #message {
      flex: 1;
      background: #1f2937;
      color: white;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 14px;
      outline: none;
      font-size: 15px;
    }

    #send {
      border: none;
      border-radius: 12px;
      padding: 0 22px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    #send:hover {
      background: #1d4ed8;
    }

    #send:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-bottom: 15px;
      padding: 13px 16px;
      border-radius: 12px;
      max-width: 80%;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
    }

    .ai {
      background: #1f2937;
      margin-right: auto;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="logo">Z</div>

      <div>
        <h1>Zendrex AI</h1>
        <p>Your AI assistant</p>
      </div>
    </div>

    <div class="chat" id="chat">

      <div class="welcome" id="welcome">
        <h2>Welcome to Zendrex AI</h2>
        <p>Ask me anything.</p>
      </div>

    </div>

    <div class="input-area">

      <input
        id="message"
        type="text"
        placeholder="Ask Zendrex AI..."
      >

      <button id="send">Send</button>

    </div>

  </div>

  <script>

    const input = document.getElementById("message");
    const send = document.getElementById("send");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");

    const WORKER_URL =
      "https://steep-fog-986f.konanwork99.workers.dev";

    async function sendMessage() {

      const text = input.value.trim();

      if (!text) return;

      welcome.style.display = "none";

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = text;

      chat.appendChild(userMessage);

      input.value = "";
      send.disabled = true;

      const aiMessage = document.createElement("div");
      aiMessage.className = "message ai";
      aiMessage.textContent = "Thinking...";

      chat.appendChild(aiMessage);

      chat.scrollTop = chat.scrollHeight;

      try {

        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            prompt: text
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Request failed");
        }

        aiMessage.textContent =
          data.answer || "No answer received.";

      } catch (error) {

        console.error("Zendrex AI error:", error);

        aiMessage.textContent =
          "Sorry, Zendrex AI could not connect to the AI server.";

      } finally {

        send.disabled = false;
        input.focus();

      }

      chat.scrollTop = chat.scrollHeight;
    }

    send.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    });

  </script>

</body>
</html>
