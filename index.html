<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zendrex AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #050812;
      --panel: rgba(10, 16, 30, 0.88);
      --panel-2: rgba(15, 23, 42, 0.9);
      --border: rgba(120, 150, 200, 0.16);
      --text: #f4f7ff;
      --muted: #8d9ab3;
      --accent: #28a9ff;
      --accent-2: #00e5ff;
      --user: #16243b;
      --danger: #ff4d67;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    body.light {
      --bg: #eef3f9;
      --panel: rgba(255, 255, 255, 0.9);
      --panel-2: #ffffff;
      --border: rgba(20, 40, 70, 0.12);
      --text: #111827;
      --muted: #667085;
      --user: #e5f2ff;
      --shadow: 0 20px 50px rgba(30, 60, 100, 0.15);
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(0, 174, 255, 0.12), transparent 28%),
        radial-gradient(circle at 80% 90%, rgba(0, 229, 255, 0.08), transparent 30%),
        var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* SIDEBAR */

    .sidebar {
      width: 270px;
      border-right: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(20px);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 5px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 14px;
    }

    .brand-text {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand-text span {
      color: var(--accent-2);
    }

    .new-chat {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid rgba(40, 169, 255, 0.35);
      border-radius: 13px;
      background: linear-gradient(135deg, #1289dc, #00bde9);
      color: white;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 174, 255, 0.15);
    }

    .new-chat:hover {
      filter: brightness(1.08);
    }

    .sidebar-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .quick-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .quick-btn,
    .side-btn {
      width: 100%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 11px;
      padding: 10px 12px;
      text-align: left;
      transition: 0.2s;
    }

    .quick-btn:hover,
    .side-btn:hover {
      background: rgba(40, 169, 255, 0.08);
      border-color: rgba(40, 169, 255, 0.3);
    }

    .sidebar-bottom {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* MAIN */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 70px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 13px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #27e58b;
      box-shadow: 0 0 12px #27e58b;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 11px;
      font-size: 17px;
    }

    .icon-btn:hover {
      background: rgba(40, 169, 255, 0.08);
    }

    /* CHAT */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 28px 20px 150px;
      scroll-behavior: smooth;
    }

    .chat-inner {
      width: min(900px, 100%);
      margin: auto;
    }

    .welcome {
      min-height: 65vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .welcome-logo {
      width: 130px;
      height: 130px;
      object-fit: contain;
      margin-bottom: 15px;
      filter: drop-shadow(0 0 25px rgba(0, 210, 255, 0.25));
    }

    .welcome h1 {
      font-size: clamp(32px, 6vw, 55px);
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .welcome h1 span {
      color: var(--accent-2);
    }

    .welcome p {
      color: var(--muted);
      max-width: 580px;
      line-height: 1.6;
    }

    .prompt-grid {
      width: min(700px, 100%);
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .prompt-card {
      padding: 15px;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 14px;
      color: var(--text);
      text-align: left;
      transition: 0.2s;
    }

    .prompt-card:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 229, 255, 0.3);
      background: var(--panel-2);
    }

    /* MESSAGES */

    .message {
      display: flex;
      margin: 20px 0;
      gap: 12px;
      animation: appear 0.2s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--panel-2);
      border: 1px solid var(--border);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .bubble {
      max-width: min(760px, 85%);
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 16px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    .assistant .bubble {
      background: var(--panel);
      border: 1px solid var(--border);
      border-top-left-radius: 5px;
    }

    .user .bubble {
      background: var(--user);
      border: 1px solid var(--border);
      border-top-right-radius: 5px;
    }

    .message-tools {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .copy-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 12px;
    }

    .copy-btn:hover {
      color: var(--text);
      background: rgba(40, 169, 255, 0.08);
    }

    /* CODE */

    pre {
      position: relative;
      margin: 12px 0;
      padding: 15px;
      padding-top: 42px;
      overflow-x: auto;
      border-radius: 12px;
      background: #05070c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-family: Consolas, monospace;
      font-size: 14px;
      line-height: 1.55;
    }

    .code-copy {
      position: absolute;
      top: 8px;
      right: 8px;
    }

    code {
      font-family: Consolas, monospace;
    }

    /* TYPING */

    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px 2px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-2);
      animation: typing 1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        opacity: 0.25;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    /* INPUT */

    .input-area {
      position: fixed;
      bottom: 0;
      right: 0;
      left: 270px;
      padding: 18px 20px 20px;
      background: linear-gradient(
        to top,
        var(--bg) 60%,
        transparent
      );
    }

    .input-box {
      width: min(900px, 100%);
      margin: auto;
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(20px);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 10px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      min-height: 46px;
      max-height: 180px;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      padding: 11px 10px;
      font-size: 16px;
      line-height: 1.5;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .send-btn,
    .stop-btn {
      height: 46px;
      min-width: 46px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 18px;
      font-weight: 700;
    }

    .send-btn {
      background: linear-gradient(135deg, #1289dc, #00c9ef);
    }

    .stop-btn {
      background: var(--danger);
      display: none;
    }

    .input-footer {
      display: flex;
      justify-content: space-between;
      padding: 5px 8px 1px;
      color: var(--muted);
      font-size: 11px;
    }

    /* MOBILE */

    @media (max-width: 760px) {
      .sidebar {
        display: none;
      }

      .input-area {
        left: 0;
        padding: 12px;
      }

      .topbar {
        padding: 0 13px;
      }

      .chat {
        padding: 18px 12px 130px;
      }

      .bubble {
        max-width: 90%;
      }

      .prompt-grid {
        grid-template-columns: 1fr;
      }

      .welcome-logo {
        width: 105px;
        height: 105px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="brand">
        <img src="zendrex-logo.png" alt="Zendrex AI">
        <div class="brand-text">Zendrex <span>AI</span></div>
      </div>

      <button class="new-chat" onclick="newChat()">
        + New Chat
      </button>

      <div class="sidebar-title">
        Quick prompts
      </div>

      <div class="quick-list">
        <button class="quick-btn" onclick="usePrompt('Explain how an API works')">
          Explain an API
        </button>

        <button class="quick-btn" onclick="usePrompt('Help me build a website')">
          Build a website
        </button>

        <button class="quick-btn" onclick="usePrompt('Help me debug my code')">
          Debug code
        </button>

        <button class="quick-btn" onclick="usePrompt('Give me some project ideas')">
          Project ideas
        </button>
      </div>

      <div class="sidebar-bottom">

        <button class="side-btn" onclick="clearChat()">
          🗑 Clear chat
        </button>

        <button class="side-btn" onclick="exportChat()">
          ↓ Export chat
        </button>

        <button class="side-btn" onclick="toggleTheme()">
          ◐ Change theme
        </button>

      </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

      <header class="topbar">

        <div class="status">
          <span class="status-dot"></span>
          Zendrex AI online
        </div>

        <div class="top-actions">
          <button class="icon-btn" onclick="toggleTheme()" title="Theme">
            ◐
          </button>
        </div>

      </header>

      <!-- CHAT -->
      <section class="chat" id="chat">

        <div class="chat-inner" id="chatInner">

          <div class="welcome" id="welcome">

            <img
              src="zendrex-logo.png"
              alt="Zendrex AI Logo"
              class="welcome-logo"
            >

            <h1>
              Welcome to <span>Zendrex</span>
            </h1>

            <p>
              A simple AI assistant for questions, coding,
              websites, apps, ideas, explanations and more.
            </p>

            <div class="prompt-grid">

              <button
                class="prompt-card"
                onclick="usePrompt('What can you help me with?')"
              >
                💡 What can you help me with?
              </button>

              <button
                class="prompt-card"
                onclick="usePrompt('Give me a cool website idea')"
              >
                🌐 Give me a website idea
              </button>

              <button
                class="prompt-card"
                onclick="usePrompt('Teach me something interesting')"
              >
                🧠 Teach me something
              </button>

              <button
                class="prompt-card"
                onclick="usePrompt('Help me create a simple app')"
              >
                ⚡ Help me create an app
              </button>

            </div>

          </div>

        </div>

      </section>

    </main>

  </div>

  <!-- INPUT -->
  <div class="input-area">

    <div class="input-box">

      <div class="input-row">

        <textarea
          id="messageInput"
          placeholder="Message Zendrex AI..."
          rows="1"
          maxlength="6000"
        ></textarea>

        <button
          class="stop-btn"
          id="stopBtn"
          onclick="stopGeneration()"
        >
          ■
        </button>

        <button
          class="send-btn"
          id="sendBtn"
          onclick="sendMessage()"
        >
          ↑
        </button>

      </div>

      <div class="input-footer">
        <span>Enter to send · Shift + Enter for new line</span>
        <span id="counter">0 / 6000</span>
      </div>

    </div>

  </div>

  <script>

    /* =========================
       CONFIG
    ========================= */

    const WORKER_URL =
      "https://steep-fog-986f.konanwork99.workers.dev";


    /* =========================
       ELEMENTS
    ========================= */

    const chat = document.getElementById("chat");
    const chatInner = document.getElementById("chatInner");
    const welcome = document.getElementById("welcome");
    const input = document.getElementById("messageInput");
    const counter = document.getElementById("counter");
    const sendBtn = document.getElementById("sendBtn");
    const stopBtn = document.getElementById("stopBtn");


    let controller = null;
    let messages = [];


    /* =========================
       LOAD CHAT
    ========================= */

    function loadChat() {

      try {

        const saved =
          JSON.parse(localStorage.getItem("zendrex_chat") || "[]");

        if (!Array.isArray(saved)) return;

        messages = saved;

        if (messages.length > 0) {
          welcome.style.display = "none";

          messages.forEach(message => {
            addMessage(
              message.role,
              message.content,
              false
            );
          });
        }

      } catch (error) {
        console.log("Could not load chat.");
      }
    }


    /* =========================
       SAVE CHAT
    ========================= */

    function saveChat() {

      localStorage.setItem(
        "zendrex_chat",
        JSON.stringify(messages)
      );
    }


    /* =========================
       ADD MESSAGE
    ========================= */

    function addMessage(role, text, save = true) {

      if (welcome) {
        welcome.style.display = "none";
      }

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "message " + role;

      const avatar =
        document.createElement("div");

      avatar.className = "avatar";

      if (role === "assistant") {

        const img =
          document.createElement("img");

        img.src = "zendrex-logo.png";
        img.alt = "Zendrex";

        avatar.appendChild(img);

      } else {

        avatar.textContent = "👤";
      }


      const content =
        document.createElement("div");


      const bubble =
        document.createElement("div");

      bubble.className = "bubble";


      if (role === "assistant") {

        bubble.innerHTML =
          formatAIResponse(text);

      } else {

        bubble.textContent = text;
      }


      content.appendChild(bubble);


      if (role === "assistant") {

        const tools =
          document.createElement("div");

        tools.className = "message-tools";

        const copy =
          document.createElement("button");

        copy.className = "copy-btn";

        copy.textContent = "Copy";

        copy.onclick = () => {
          navigator.clipboard.writeText(text);
          copy.textContent = "Copied!";
          setTimeout(() => {
            copy.textContent = "Copy";
          }, 1200);
        };

        tools.appendChild(copy);
        content.appendChild(tools);
      }


      if (role === "user") {

        wrapper.appendChild(content);
        wrapper.appendChild(avatar);

      } else {

        wrapper.appendChild(avatar);
        wrapper.appendChild(content);
      }


      chatInner.appendChild(wrapper);


      if (save) {

        messages.push({
          role,
          content: text
        });

        saveChat();
      }


      scrollToBottom();

      return wrapper;
    }


    /* =========================
       FORMAT AI RESPONSE
    ========================= */

    function formatAIResponse(text) {

      let escaped =
        escapeHTML(text);


      escaped =
        escaped.replace(
          /```([\s\S]*?)```/g,
          function(match, code) {

            const cleanCode =
              code.trim();

            return `
              <pre>
                <button
                  class="copy-btn code-copy"
                  onclick="copyCode(this)"
                >
                  Copy code
                </button>
                <code>${cleanCode}</code>
              </pre>
            `;
          }
        );


      escaped =
        escaped.replace(
          /`([^`]+)`/g,
          "<code>$1</code>"
        );


      escaped =
        escaped.replace(
          /\n/g,
          "<br>"
        );


      return escaped;
    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHTML(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =========================
       COPY CODE
    ========================= */

    function copyCode(button) {

      const pre =
        button.closest("pre");

      const code =
        pre.querySelector("code");

      navigator.clipboard.writeText(
        code.innerText
      );

      button.textContent = "Copied!";

      setTimeout(() => {
        button.textContent = "Copy code";
      }, 1200);
    }


    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage() {

      const message =
        input.value.trim();

      if (!message) return;


      addMessage(
        "user",
        message
      );


      input.value = "";
      updateCounter();
      autoResize();


      setLoading(true);


      const typing =
        document.createElement("div");

      typing.className =
        "message assistant";

      typing.id =
        "typingMessage";

      typing.innerHTML = `
        <div class="avatar">
          <img
            src="zendrex-logo.png"
            alt="Zendrex"
          >
        </div>

        <div class="bubble">
          <div class="typing">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      `;

      chatInner.appendChild(typing);

      scrollToBottom();


      controller =
        new AbortController();


      try {

        const response =
          await fetch(
            WORKER_URL,
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                prompt: message
              }),

              signal:
                controller.signal
            }
          );


        const data =
          await response.json();


        const typingElement =
          document.getElementById(
            "typingMessage"
          );

        if (typingElement) {
          typingElement.remove();
        }


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Request failed."
          );
        }


        const answer =
          String(
            data.answer ||
            "Sorry, I couldn't generate a response."
          );


        addMessage(
          "assistant",
          answer
        );


      } catch (error) {

        const typingElement =
          document.getElementById(
            "typingMessage"
          );

        if (typingElement) {
          typingElement.remove();
        }


        if (error.name === "AbortError") {

          addMessage(
            "assistant",
            "Generation stopped."
          );

        } else {

          addMessage(
            "assistant",
            "Sorry, something went wrong. Please try again."
          );

          console.error(error);
        }

      } finally {

        controller = null;

        setLoading(false);
      }
    }


    /* =========================
       LOADING STATE
    ========================= */

    function setLoading(loading) {

      sendBtn.style.display =
        loading ? "none" : "block";

      stopBtn.style.display =
        loading ? "block" : "none";

      input.disabled =
        loading;
    }


    /* =========================
       STOP
    ========================= */

    function stopGeneration() {

      if (controller) {
        controller.abort();
      }
    }


    /* =========================
       NEW CHAT
    ========================= */

    function newChat() {

      messages = [];

      localStorage.removeItem(
        "zendrex_chat"
      );

      chatInner.innerHTML = "";

      chatInner.appendChild(
        createWelcome()
      );

      input.focus();
    }


    /* =========================
       CREATE WELCOME
    ========================= */

    function createWelcome() {

      const div =
        document.createElement("div");

      div.className = "welcome";
      div.id = "welcome";

      div.innerHTML = `
        <img
          src="zendrex-logo.png"
          alt="Zendrex AI Logo"
          class="welcome-logo"
        >

        <h1>
          Welcome to <span>Zendrex</span>
        </h1>

        <p>
          A simple AI assistant for questions,
          coding, websites, apps, ideas,
          explanations and more.
        </p>

        <div class="prompt-grid">

          <button
            class="prompt-card"
            onclick="usePrompt('What can you help me with?')"
          >
            💡 What can you help me with?
          </button>

          <button
            class="prompt-card"
            onclick="usePrompt('Give me a cool website idea')"
          >
            🌐 Give me a website idea
          </button>

          <button
            class="prompt-card"
            onclick="usePrompt('Teach me something interesting')"
          >
            🧠 Teach me something
          </button>

          <button
            class="prompt-card"
            onclick="usePrompt('Help me create a simple app')"
          >
            ⚡ Help me create an app
          </button>

        </div>
      `;

      return div;
    }


    /* =========================
       CLEAR CHAT
    ========================= */

    function clearChat() {

      if (!confirm("Clear this chat?")) {
        return;
      }

      newChat();
    }


    /* =========================
       QUICK PROMPT
    ========================= */

    function usePrompt(text) {

      input.value = text;

      updateCounter();
      autoResize();

      input.focus();
    }


    /* =========================
       EXPORT CHAT
    ========================= */

    function exportChat() {

      if (!messages.length) {
        alert("There is no chat to export yet.");
        return;
      }


      let output =
        "ZENDREX AI CHAT\n\n";


      messages.forEach(message => {

        output +=
          `${message.role.toUpperCase()}:\n`;

        output +=
          `${message.content}\n\n`;
      });


      const blob =
        new Blob(
          [output],
          {
            type: "text/plain"
          }
        );


      const url =
        URL.createObjectURL(blob);


      const a =
        document.createElement("a");

      a.href = url;

      a.download =
        "zendrex-chat.txt";

      a.click();


      URL.revokeObjectURL(url);
    }


    /* =========================
       THEME
    ========================= */

    function toggleTheme() {

      document.body.classList.toggle(
        "light"
      );

      localStorage.setItem(
        "zendrex_theme",
        document.body.classList.contains("light")
          ? "light"
          : "dark"
      );
    }


    /* =========================
       AUTO RESIZE
    ========================= */

    function autoResize() {

      input.style.height = "auto";

      input.style.height =
        Math.min(
          input.scrollHeight,
          180
        ) + "px";
    }


    /* =========================
       COUNTER
    ========================= */

    function updateCounter() {

      counter.textContent =
        `${input.value.length} / 6000`;
    }


    /* =========================
       SCROLL
    ========================= */

    function scrollToBottom() {

      setTimeout(() => {

        chat.scrollTop =
          chat.scrollHeight;

      }, 30);
    }


    /* =========================
       INPUT EVENTS
    ========================= */

    input.addEventListener(
      "input",
      () => {

        updateCounter();
        autoResize();
      }
    );


    input.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();
        }
      }
    );


    /* =========================
       LOAD THEME
    ========================= */

    if (
      localStorage.getItem(
        "zendrex_theme"
      ) === "light"
    ) {

      document.body.classList.add(
        "light"
      );
    }


    /* =========================
       START
    ========================= */

    loadChat();

    updateCounter();

    autoResize();

  </script>

</body>
</html>
